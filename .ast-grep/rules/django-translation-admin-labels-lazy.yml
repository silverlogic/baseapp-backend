id: django-translation-admin-labels-lazy
language: Python
severity: error
message: "Admin column / action labels are user-facing: wrap them in `gettext_lazy` — `short_description = _(\"Expire password\")`, `@admin.display(description=_(\"Actor\"))`. See .claude/skills/backend-conventions/references/translations.md"
ignores:
  - "**/migrations/**"
  - "**/tests/**"
rule:
  any:
    # force_expire_password.short_description = "Expire password"
    - kind: assignment
      all:
        - has:
            field: left
            regex: (^|\.)short_description$
        - has:
            field: right
            kind: string
    # @admin.display(description="Actor") / @admin.action(description="Do it")
    - kind: keyword_argument
      all:
        - has:
            field: name
            regex: ^description$
        - has:
            field: value
            kind: string
      inside:
        kind: argument_list
        inside:
          kind: call
          has:
            field: function
            regex: ^(admin\.)?(display|action)$
