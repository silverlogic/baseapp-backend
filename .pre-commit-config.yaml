repos:
-   repo: https://github.com/pycqa/isort
    rev: 4.3.21
    hooks:
      - id: isort
        name: isort (python)
-   repo: https://github.com/psf/black
    rev: 22.8.0
    hooks:
    - id: black
      language_version: python3
-   repo: https://github.com/pycqa/flake8
    rev: 5.0.4
    hooks:
    - id: flake8
-   repo: local
    hooks:
    - id: compile-translations
      name: compile translation catalogs (.po -> .mo)
      entry: python scripts/i18n/compile_catalogs.py
      language: python
      additional_dependencies: [polib==1.2.0]
      files: \.po$