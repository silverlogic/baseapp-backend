repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # keep in step with the ruff pin in pyproject.toml
    hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format
-   repo: local
    hooks:
    - id: compile-translations
      name: compile translation catalogs (.po -> .mo)
      entry: python scripts/i18n/compile_catalogs.py
      language: python
      additional_dependencies: [polib==1.2.0]
      files: \.po$