[pytest]
DJANGO_SETTINGS_MODULE = testproject.settings
# -- recommended but optional:
python_files = tests.py test_*.py *_tests.py
# The repository root, so -p can load baseapp_core.n_plus_one.pytest_plugin before collection.
pythonpath = .

# baseapp_drf_view_action_permissions runs separately because it needs its own User model with a custom PermissionModelMixin
addopts = --ignore=baseapp_drf_view_action_permissions -p baseapp_core.n_plus_one.pytest_plugin
# N+1 warnings (baseapp_core.n_plus_one): NPLUSONE_REPORT=1 prints its own report instead.
# -W "error:N+1 detected::baseapp_core.n_plus_one" overrides this and fails the tests that hit one.
filterwarnings =
    ignore:N\+1 detected:UserWarning
